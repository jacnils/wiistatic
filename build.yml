name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          command -v cmake >/dev/null || (apt-get update && apt-get install -y cmake)
          dkp-pacman -Sy --noconfirm --needed libfat-ogc

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Wii.cmake"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          DOL=$(find build -name '*.dol' | head -n 1)

          if [ -z "$DOL" ]; then
            echo "::error::No .dol was found"
            exit 1
          fi

          mkdir -p package/apps/wiistatic
          cp "$DOL" package/apps/wiistatic/boot.dol
          if [ -f meta.xml ]; then cp meta.xml package/apps/wiistatic/; fi
          if [ -f icon.png ]; then cp icon.png package/apps/wiistatic/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: wiistatic
          path: package
          if-no-files-found: error
